include-file = ~/.config/polybar/modules.ini

[colors]
include-file = ~/.cache/wal/colors-polybar

[bar/showy]
monitor = ${env:MONITOR:}
width = 100%
height = 28pt
radius = 5

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 6pt
border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1
module-margin = 1

separator = |
separator-foreground = ${colors.primary}

font-0 = MesloLGS Nerd Font Mono:size=11;4
font-1 = MesloLGS Nerd Font Mono:size=16;6
font-2 = MesloLGS Nerd Font Mono:size=20;6
font-3 = MesloLGS Nerd Font Mono:size=14;4
font-4 = MesloLGS Nerd Font Mono:bold:size=13;4
font-5 = MesloLGS Nerd Font Mono:size=14;5

modules-left = xworkspaces memory cpu temperature playerctl
modules-center = date
modules-right = network bluetooth audio brightness battery power

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true


[bar/focus]
monitor = ${env:MONITOR:}
width = 100%
height = 24pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 5pt

padding-left = 1
padding-right = 1
module-margin = 1

separator = |
separator-foreground = ${colors.primary}

font-0 = MesloLGS Nerd Font Mono:size=10;3
font-1 = MesloLGS Nerd Font Mono:size=15;5
font-2 = MesloLGS Nerd Font Mono:size=19;5
font-3 = MesloLGS Nerd Font Mono:size=13;3
font-4 = MesloLGS Nerd Font Mono:bold:size=12;3
font-5 = MesloLGS Nerd Font Mono:size=13;4

modules-left = xworkspaces memory cpu temperature playerctl
modules-center = date
modules-right = network bluetooth audio brightness battery power

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true


[settings]
screenchange-reload = true
