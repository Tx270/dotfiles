[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.primary}
label-active-foreground = ${colors.background}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/power]
type = custom/text
label = 
label-font = 2
label-foreground = ${colors.primary}
click-left = ~/.config/rofi/powermenu.sh

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 1
click-left = kitty -e bluetui

[module/sysmonitor]
type = custom/script
exec = ~/.config/polybar/scripts/sysmonitor.sh
interval = 100
format = <label>
label = %output%

[module/playerctl]
type = custom/script
exec = ~/.config/polybar/scripts/playerctl.sh
interval = 1
click-left = ~/.config/polybar/scripts/playerctl.sh --play-pause

[module/audio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>
label-muted = %{T3}%{T-} -
label-muted-foreground = ${colors.primary}
ramp-volume-0 = %{T3}%{T-}
ramp-volume-1 = %{T3}%{T-}
ramp-volume-2 = %{T3}%{T-}
ramp-volume-foreground = ${colors.primary}
label-volume = %percentage%%

[module/brightness]
type = internal/backlight
card = intel_backlight
format = %{A1:pgrep redshift > /dev/null && { pkill redshift; notify-send "Redshift" "Redshift stopped"; } || { redshift & notify-send "Redshift" "Redshift started"; }:}<ramp> <label>%{A}
label = %percentage%%
ramp-0 = %{T3}󰃞%{T-}
ramp-1 = %{T3}󰃟%{T-}
ramp-2 = %{T3}󰃠%{T-}
ramp-foreground = ${colors.primary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = %{T2}%{T-}
format-prefix-foreground = ${colors.primary}
label = %percentage_used:3%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = %{T2}%{T-}
format-prefix-foreground = ${colors.primary}
label = %percentage:3%%

[module/temperature]
type = internal/temperature
interval = 0.5
thermal-zone = 2
zone-type = x86_pkg_temp
base-temperature = 20
warn-temperature = 90
format = <ramp> <label>
format-warn = <ramp> <label-warn>
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}
ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-foreground = ${colors.primary}

[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
interval = 2
label = %output%
click-left = ~/.config/rofi/battery.sh

[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
click-left = kitty -e impala

[module/date]
type = internal/date
interval = 1

date = %H:%M:%S  %d.%m.%Y
label = %{T5}%date%
label-foreground = ${colors.primary}
